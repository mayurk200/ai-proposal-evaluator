services:
  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: agrieval-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - agrieval-network

  # PostgreSQL Database.
  # pgvector/pgvector ships the `vector` extension preinstalled — the stock
  # postgres image does not, and `CREATE EXTENSION vector` fails against it.
  # The similarity gate (duplicate-idea detection) depends on this.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agrieval-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agrieval}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agrieval123}
      - POSTGRES_DB=${POSTGRES_DB:-agrieval}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrieval} -d ${POSTGRES_DB:-agrieval}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agrieval-network

volumes:
  minio-data:
  postgres-data:

networks:
  agrieval-network:
    driver: bridge
