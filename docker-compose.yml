services:
  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: agrieval-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - agrieval-network

  # One-shot: create the proposals bucket + allow public downloads, then exit.
  createbuckets:
    image: minio/mc:latest
    container_name: agrieval-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-proposals};
      mc anonymous set download local/${S3_BUCKET:-proposals};
      echo 'Bucket ${S3_BUCKET:-proposals} ready';
      "
    networks:
      - agrieval-network

  # Backend API in a container. NOT started by default: local development runs
  # the backend on the host (scripts\dev.ps1 / npm run dev). Start it with:
  #   docker compose --profile full up -d
  backend:
    profiles: ["full"]
    build: ./backend
    container_name: agrieval-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env}
      # Inside the compose network Postgres is reachable as "postgres".
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agrieval}:${POSTGRES_PASSWORD:-agrieval123}@postgres:5432/${POSTGRES_DB:-agrieval}
      # The Python service runs on the host in dev; reach it via the gateway.
      - PYTHON_SERVICE_URL=${PYTHON_SERVICE_URL:-http://host.docker.internal:8000}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Phase 1 storage: files land in the MinIO bucket.
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_ENDPOINT=http://localhost:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_REGION=us-east-1
      - S3_BUCKET=${S3_BUCKET:-proposals}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - CORS_ORIGINS=http://localhost:3001,http://localhost:5173
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agrieval-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agrieval-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agrieval}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agrieval123}
      - POSTGRES_DB=${POSTGRES_DB:-agrieval}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrieval} -d ${POSTGRES_DB:-agrieval}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agrieval-network

volumes:
  minio-data:
  postgres-data:

networks:
  agrieval-network:
    driver: bridge
